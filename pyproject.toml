[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-stop-kit"
version = "0.1.0rc3"
description = "Local, review-first physical mail cleanup for people and their agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "EarlyCo Inc."}]
dependencies = []

[project.optional-dependencies]
lob = ["reportlab>=4.4,<5"]

[project.scripts]
mail-stop = "mail_stop.cli:main"

[tool.setuptools.packages.find]
include = ["mail_stop*"]

[tool.setuptools.package-data]
mail_stop = ["playbooks.json", "route_directory.json"]
