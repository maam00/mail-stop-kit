name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install core and optional PDF support
        run: python -m pip install ".[lob]"
      - name: Run synthetic tests without credentials or provider calls
        run: python -m unittest discover -s tests -v
      - name: Check installed CLI and bundled procedures
        run: |
          python -I -m mail_stop --help
          python -I -m mail_stop playbooks
          python -I -m mail_stop routes
      - name: Review fictional envelopes
        run: python -m mail_stop plan --household examples/household.json --mail examples/mail.json
